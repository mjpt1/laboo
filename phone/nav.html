<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مسیریاب لبو</title>
<style>
  :root { --bg:#0e0e12; --card:#1a1a22; --fg:#f2f2f5; --mute:#9a9aa8; --acc:#ff9a1e; --ok:#2fd86a; --bad:#e04848; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.6 Tahoma, "Vazirmatn", sans-serif; padding:16px; max-width:560px; margin-inline:auto; }
  h1 { font-size:20px; margin:0 0 12px; }
  .card { background:var(--card); border-radius:14px; padding:14px; margin-bottom:12px; }
  button { background:var(--acc); color:#111; border:0; border-radius:10px; padding:12px 16px; font:inherit; font-weight:bold; cursor:pointer; }
  button.sec { background:#2a2a36; color:var(--fg); }
  button:disabled { opacity:.4; }
  input { width:100%; padding:12px; border-radius:10px; border:1px solid #333; background:#111; color:var(--fg); font:inherit; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--bad); display:inline-block; }
  .dot.on { background:var(--ok); }
  #results div { padding:10px; border-bottom:1px solid #2a2a36; cursor:pointer; }
  #results div:hover { background:#24242e; }
  #big { text-align:center; }
  #arrow { font-size:96px; line-height:1.1; color:var(--acc); }
  #dist { font-size:40px; font-weight:bold; }
  #instr, #status { color:var(--mute); }
  small { color:var(--mute); }
</style>
</head>
<body>
<h1>مسیریاب لبو</h1>

<div class="card row">
  <button id="btConnect">وصل به لبو</button>
  <span><span id="btDot" class="dot"></span> <span id="btText">وصل نیست</span></span>
</div>

<div class="card">
  <div class="row" style="margin-bottom:8px">
    <input id="q" placeholder="مقصد: مثلاً میدان تجریش">
  </div>
  <div class="row" style="margin-bottom:8px">
    <input id="from" placeholder="مبدأ دستی (اگر GPS مختل است)، مثلاً میدان ونک">
  </div>
  <div class="row"><button id="search">جستجو</button><small id="gpsText">در انتظار GPS…</small></div>
  <div id="results"></div>
</div>

<div class="card" id="big">
  <div id="arrow">⬆</div>
  <div id="dist">—</div>
  <div id="instr">مقصدی انتخاب نشده</div>
  <div id="status"></div>
  <div class="row" style="justify-content:center;margin-top:10px">
    <button class="sec" id="sim" disabled>شبیه‌سازی رانندگی</button>
    <button class="sec" id="stop" disabled>پایان مسیر</button>
  </div>
</div>
<small>کروم اندروید، با بلوتوث و GPS روشن. صفحه را باز نگه دارید.</small>

<script>
const SVC = "6e400001-1a8b-4f2e-9b6c-1ab0b0ba0001";
const RX  = "6e400002-1a8b-4f2e-9b6c-1ab0b0ba0001";
const $ = id => document.getElementById(id);
let rx = null, here = null, route = null, sim = null, wake = null, offCount = 0, lastSent = "", lastSentAt = 0;

// ------------------------------------------------ bluetooth
$("btConnect").onclick = async () => {
  if (!navigator.bluetooth) {                     // iPhone: Safari/Chrome have no Web Bluetooth
    $("btText").textContent = /iPhone|iPad/.test(navigator.userAgent)
      ? "آیفون در سافاری و کروم بلوتوث وب ندارد. اپ رایگان Bluefy را از App Store نصب کنید و همین صفحه را در آن باز کنید."
      : "این مرورگر بلوتوث وب ندارد؛ با کروم باز کنید.";
    return;
  }
  try {
    const dev = await navigator.bluetooth.requestDevice({ filters: [{ name: "Laboo" }], optionalServices: [SVC] });
    dev.addEventListener("gattserverdisconnected", () => { rx = null; btUi(false); setTimeout(() => reconnect(dev), 1500); });
    await connectDev(dev);
  } catch (e) { $("btText").textContent = "خطا: " + e.message; }
};
async function connectDev(dev) {
  const srv = await dev.gatt.connect();
  rx = await (await srv.getPrimaryService(SVC)).getCharacteristic(RX);
  btUi(true); lastSent = "";
  const n = new Date();                                    // set Laboo's clock from the phone
  try { await rx.writeValueWithoutResponse(new TextEncoder().encode(`T,${n.getFullYear()},${n.getMonth() + 1},${n.getDate()},${n.getHours()},${n.getMinutes()},${n.getSeconds()}`)); } catch (e) {}
}
async function reconnect(dev) { try { await connectDev(dev); } catch (e) { setTimeout(() => reconnect(dev), 3000); } }
function btUi(on) { $("btDot").className = "dot" + (on ? " on" : ""); $("btText").textContent = on ? "وصل است" : "وصل نیست"; }
let sending = false;
async function send(msg) {
  if (!rx || sending) return;
  const now = Date.now();
  if (msg === lastSent && now - lastSentAt < 4000) return;     // repeat every 4 s so the board knows we are alive
  sending = true;
  try { await rx.writeValueWithoutResponse(new TextEncoder().encode(msg)); lastSent = msg; lastSentAt = now; }
  catch (e) {} finally { sending = false; }
}

// ------------------------------------------------ gps
if (navigator.geolocation) navigator.geolocation.watchPosition(p => {
  if (sim) return;
  const g = { lat: p.coords.latitude, lon: p.coords.longitude };
  // ignore a spoofed fix (outside Iran) while a manual start is used
  if (manualFrom && (g.lat < 25 || g.lat > 40 || g.lon < 44 || g.lon > 64)) { $("gpsText").textContent = "GPS مختل است"; return; }
  here ={ lat: p.coords.latitude, lon: p.coords.longitude, acc: p.coords.accuracy };
  $("gpsText").textContent = "GPS: دقت " + Math.round(p.coords.accuracy) + " متر";
  tick();
}, e => $("gpsText").textContent = "GPS: " + e.message, { enableHighAccuracy: true, maximumAge: 1000 });

// ------------------------------------------------ search + route
$("search").onclick = async () => {
  const q = $("q").value.trim(); if (!q) return;
  let url = "https://nominatim.openstreetmap.org/search?format=json&limit=6&accept-language=fa&countrycodes=ir&q=" + encodeURIComponent(q);
  if (here) url += `&viewbox=${here.lon - .5},${here.lat + .5},${here.lon + .5},${here.lat - .5}`;
  $("results").textContent = "در حال جستجو…";
  try {
    const list = await (await fetch(url)).json();
    $("results").innerHTML = "";
    if (!list.length) $("results").textContent = "چیزی پیدا نشد";
    list.forEach(r => {
      const d = document.createElement("div"); d.textContent = r.display_name;
      d.onclick = () => { $("results").innerHTML = ""; startRoute({ lat: +r.lat, lon: +r.lon }, r.display_name.split("،")[0]); };
      $("results").appendChild(d);
    });
  } catch (e) { $("results").textContent = "خطا در جستجو"; }
};

let dest = null, destName = "";
let manualFrom = null;
async function geocode(q) {
  const j = await (await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=fa&countrycodes=ir&q=" + encodeURIComponent(q))).json();
  return j.length ? { lat: +j[0].lat, lon: +j[0].lon, acc: 0 } : null;
}
async function startRoute(to, name) {
  const f = $("from").value.trim();
  if (f && !route) {
    manualFrom = await geocode(f);
    if (!manualFrom) { $("instr").textContent = "مبدأ پیدا نشد"; return; }
    here = manualFrom;
  }
  if (!here) { $("instr").textContent = "هنوز GPS پیدا نشده"; return; }
  // location from the IP (VPN!) instead of real GPS: far away and very inaccurate
  if (!sim && (here.acc > 1000 || here.lat < 25 || here.lat > 40 || here.lon < 44 || here.lon > 64)) {
    $("instr").textContent = "GPS گوشی مختل است و جای شما را (" + here.lat.toFixed(3) + "، " + here.lon.toFixed(3) + ") نشان می‌دهد. مبدأ را دستی بنویسید.";
    return;
  }
  dest = to; destName = name || destName;
  $("instr").textContent = "در حال مسیریابی…";
  try {
    const u = `https://router.project-osrm.org/route/v1/driving/${here.lon},${here.lat};${to.lon},${to.lat}?overview=full&geometries=geojson&steps=true`;
    const j = await (await fetch(u)).json();
    if (!j.routes || !j.routes.length) throw new Error("no route");
    buildRoute(j.routes[0]);
    $("sim").disabled = false; $("stop").disabled = false;
    requestWake(); tick();
  } catch (e) { $("instr").textContent = "مسیریابی نشد"; }
}

function buildRoute(r) {
  const pts = r.geometry.coordinates.map(c => ({ lat: c[1], lon: c[0] }));
  const cum = [0];
  for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + dist(pts[i - 1], pts[i]));
  const steps = [];
  r.legs.forEach(l => l.steps.forEach(s => {
    const loc = { lat: s.maneuver.location[1], lon: s.maneuver.location[0] };
    steps.push({ at: along(pts, cum, loc).d, code: code(s.maneuver), exit: s.maneuver.exit || 0, name: s.name || "", m: s.maneuver }); }));
  route = { pts, cum, steps, total: cum[cum.length - 1] };
  offCount = 0;
}

// ------------------------------------------------ manoeuvre codes (see firmware nav.h)
function code(m) {
  const t = m.type, mod = m.modifier || "";
  if (t === "arrive") return "A";
  if (t === "roundabout" || t === "rotary" || t === "roundabout turn") return "O";
  const map = { "uturn": "U", "sharp left": "HL", "sharp right": "HR", "left": "L", "right": "R", "slight left": "SL", "slight right": "SR" };
  return map[mod] || "S";
}
const ARROWS = { S: "⬆", SL: "⬉", SR: "⬈", L: "⬅", R: "➡", HL: "↙", HR: "↘", U: "↩", O: "⟳", A: "🏁" };
const WORDS = { S: "مستقیم", SL: "کمی به چپ", SR: "کمی به راست", L: "به چپ بپیچید", R: "به راست بپیچید", HL: "تند به چپ", HR: "تند به راست", U: "دور بزنید", O: "وارد میدان شوید", A: "رسیدید" };

// ------------------------------------------------ main loop
function tick() {
  if (!route || !here) return;
  const p = along(route.pts, route.cum, here);
  if (p.off > 60) { if (++offCount >= 4 && !sim) { offCount = 0; startRoute(dest); return; } } else offCount = 0;
  // next manoeuvre after where we are (skip the "depart" one)
  let s = route.steps.find((st, i) => i > 0 && st.at > p.d + 5) || route.steps[route.steps.length - 1];
  let left = Math.max(0, Math.round(s.at - p.d));
  // the long straight before a turn: show the turn anyway, it is what matters
  $("arrow").textContent = ARROWS[s.code];
  $("dist").textContent = left >= 1000 ? (left / 1000).toFixed(1) + " کیلومتر" : left + " متر";
  let w = WORDS[s.code]; if (s.code === "O" && s.exit) w += "، خروجی " + s.exit;
  $("instr").textContent = w + (s.name ? " — " + s.name : "");
  $("status").textContent = "تا مقصد: " + ((route.total - p.d) / 1000).toFixed(1) + " کیلومتر";
  send(`N,${s.code},${left},${s.exit}`).then(() => sendPath(p.d));
  if (s.code === "A" && left < 20) { $("instr").textContent = "رسیدید به " + destName; }
}
setInterval(() => { if (route) tick(); }, 1000);

// ------------------------------------------------ route line for the board's map
// points from 60 m behind to ~520 m ahead, turned so the driving direction is up,
// in screen pixels from the car (0.33 px per metre), sent in small pieces
const PX_PER_M = 0.33;
async function sendPath(d) {
  if (!rx || !route || sending) return;
  sending = true;
  const c = pointAt(route.pts, route.cum, d), c2 = pointAt(route.pts, route.cum, Math.min(route.total, d + 25));
  const kx = Math.cos(c.lat * Math.PI / 180) * 111320, ky = 110540;
  let hx = (c2.lon - c.lon) * kx, hy = (c2.lat - c.lat) * ky, hl = Math.hypot(hx, hy) || 1; hx /= hl; hy /= hl;
  const toPx = q => { const ex = (q.lon - c.lon) * kx, ny = (q.lat - c.lat) * ky;
    return [Math.round((ex * hy - ny * hx) * PX_PER_M), Math.round((ex * hx + ny * hy) * PX_PER_M)]; };
  const from = Math.max(0, d - 60), to = Math.min(route.total, d + 520);
  const pts = [toPx(pointAt(route.pts, route.cum, from))];
  for (let i = 0; i < route.pts.length; i++) if (route.cum[i] > from && route.cum[i] < to) pts.push(toPx(route.pts[i]));
  pts.push(toPx(pointAt(route.pts, route.cum, to)));
  const keep = [pts[0]];                                   // drop points closer than 5 px
  for (const q of pts.slice(1)) { const k = keep[keep.length - 1]; if (Math.hypot(q[0] - k[0], q[1] - k[1]) >= 5) keep.push(q); }
  const msg = "P," + keep.slice(0, 40).map(q => q.join(",")).join(",") + ";";
  try {
    for (let i = 0; i < msg.length; i += 18) {
      const part = (i ? "+" : "") + msg.slice(i, i + (i ? 18 : 19));
      await rx.writeValueWithoutResponse(new TextEncoder().encode(part));
      if (!i) i++;                                          // first piece carried one more char
    }
  } catch (e) {} finally { sending = false; }
}

$("stop").onclick = () => { route = null; stopSim(); send("X"); lastSent = ""; $("arrow").textContent = "⬆"; $("dist").textContent = "—"; $("instr").textContent = "مسیر تمام شد"; $("status").textContent = ""; };

// ------------------------------------------------ simulation (test at the desk)
$("sim").onclick = () => {
  if (sim) { stopSim(); return; }
  let d = 0; $("sim").textContent = "توقف شبیه‌سازی";
  sim = setInterval(() => {
    d += 40 / 3.6 * 3;                      // 40 km/h, 3x faster than real time
    if (d >= route.total) { d = route.total; stopSim(); }
    here = pointAt(route.pts, route.cum, d); tick();
  }, 1000);
};
function stopSim() { if (sim) clearInterval(sim); sim = null; $("sim").textContent = "شبیه‌سازی رانندگی"; }

// ------------------------------------------------ geometry
function dist(a, b) {
  const R = 6371000, r = Math.PI / 180, dLat = (b.lat - a.lat) * r, dLon = (b.lon - a.lon) * r;
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}
function along(pts, cum, q) {               // distance along the route of the closest point, and how far off it is
  let best = { off: 1e9, d: 0 };
  const kx = Math.cos(q.lat * Math.PI / 180) * 111320, ky = 110540;
  for (let i = 1; i < pts.length; i++) {
    const ax = pts[i - 1].lon * kx, ay = pts[i - 1].lat * ky, bx = pts[i].lon * kx, by = pts[i].lat * ky, px = q.lon * kx, py = q.lat * ky;
    const vx = bx - ax, vy = by - ay, l2 = vx * vx + vy * vy;
    let t = l2 ? ((px - ax) * vx + (py - ay) * vy) / l2 : 0; t = Math.max(0, Math.min(1, t));
    const off = Math.hypot(px - ax - vx * t, py - ay - vy * t);
    if (off < best.off) best = { off, d: cum[i - 1] + (cum[i] - cum[i - 1]) * t };
  }
  return best;
}
function pointAt(pts, cum, d) {
  for (let i = 1; i < pts.length; i++) if (cum[i] >= d) {
    const t = (d - cum[i - 1]) / ((cum[i] - cum[i - 1]) || 1);
    return { lat: pts[i - 1].lat + (pts[i].lat - pts[i - 1].lat) * t, lon: pts[i - 1].lon + (pts[i].lon - pts[i - 1].lon) * t };
  }
  return pts[pts.length - 1];
}
async function requestWake() { try { wake = await navigator.wakeLock.request("screen"); } catch (e) {} }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && route) requestWake(); });
</script>
</body>
</html>
